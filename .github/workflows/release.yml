name: release

# Publishes to PyPI when a version tag (e.g. v0.1.0) is pushed, using PyPI
# trusted publishing (OIDC): no API token is stored anywhere.
# A manual run publishes to TestPyPI instead, as a rehearsal.
#
# One-time setup by the project owner:
#   PyPI (and TestPyPI) > Publishing > add a "pending publisher":
#     project eeg-decoder, owner Z-bros, repository EEGPrep-decoder,
#     workflow release.yml, environment pypi (testpypi for TestPyPI).
#   GitHub > Settings > Environments: create "pypi" and "testpypi"
#     (optionally with required reviewers).

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Check tag, version, and changelog agree
        if: github.event_name == 'push'
        run: |
          version=$(python -c "import ast, pathlib; t = pathlib.Path('src/eeg_decoder/__init__.py').read_text(); print(next(n.value.value for n in ast.parse(t).body if isinstance(n, ast.Assign) and n.targets[0].id == '__version__'))")
          test "v$version" = "$GITHUB_REF_NAME" || { echo "Tag $GITHUB_REF_NAME does not match __version__ $version"; exit 1; }
          grep -Eq "^## \[$version\] - [0-9]{4}-[0-9]{2}-[0-9]{2}" CHANGELOG.md || { echo "CHANGELOG.md needs a dated '## [$version] - YYYY-MM-DD' entry"; exit 1; }
      - name: Build and check
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check --strict dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  pypi:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/eeg-decoder/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  testpypi:
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/project/eeg-decoder/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
