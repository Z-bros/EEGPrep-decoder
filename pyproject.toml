[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "eeg-decoder"
dynamic = ["version"]
description = "Model-agnostic, reproducible EEG preprocessing and data preparation library."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Zidane Fatuna" }]
keywords = ["EEG", "signal-processing", "preprocessing", "artifacts", "data-preparation", "MNE"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]

# MNE-Python is the preprocessing backbone (filters, referencing, epochs).
# SciPy and matplotlib come with MNE but are listed because the library imports
# them directly. Every floor is tested in CI (the "minimum" job in tests.yml):
# MNE 1.13 is the version whose API was verified; NumPy, SciPy, and matplotlib
# floors are MNE 1.13's own. Further requirements go in optional groups.
dependencies = ["numpy>=2.1", "scipy>=1.14", "mne>=1.13", "matplotlib>=3.9"]

[project.urls]
Homepage = "https://github.com/Z-bros/EEGPrep-decoder"
Documentation = "https://github.com/Z-bros/EEGPrep-decoder/tree/main/docs"
Source = "https://github.com/Z-bros/EEGPrep-decoder"
Issues = "https://github.com/Z-bros/EEGPrep-decoder/issues"
Changelog = "https://github.com/Z-bros/EEGPrep-decoder/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = ["pytest>=8"]
# Only for ICA method="picard" / "fastica"; the default "infomax" needs only MNE.
ica = ["python-picard>=0.8", "scikit-learn>=1.5"]
# Building the documentation (tested with these versions).
docs = [
    "sphinx>=9", "pydata-sphinx-theme>=0.24", "numpydoc>=1.11", "myst-parser>=5",
    "myst-nb>=1.4", "ipykernel>=7",  # execute the example notebooks
]

[tool.setuptools.dynamic]
version = { attr = "eeg_decoder.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
