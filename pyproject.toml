[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "eeg-decoder"
dynamic = ["version"]
description = "Model-agnostic, reproducible EEG preprocessing and data preparation library."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Zidane" }]
keywords = ["EEG", "signal-processing", "preprocessing", "artifacts", "data-preparation", "MNE"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
# MNE-Python is the preprocessing backbone (filters, referencing, epochs) and
# brings SciPy with it. The floor is the version whose API was verified.
# Further requirements (e.g. ICA backends, export formats) are added as optional
# dependency groups in the phase that needs them; the core stays model-free.
# matplotlib is already required by MNE; it is listed because the quality plots
# import it directly (same floor as MNE 1.13).
dependencies = ["numpy>=2.1", "mne>=1.13", "matplotlib>=3.9"]

[project.optional-dependencies]
dev = ["pytest>=8"]
# Only for ICA method="picard" / "fastica"; the default "infomax" needs only MNE.
ica = ["python-picard>=0.8", "scikit-learn>=1.5"]

[tool.setuptools.dynamic]
version = { attr = "eeg_decoder.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
